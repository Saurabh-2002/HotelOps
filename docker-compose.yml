version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: hotelops-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - hotelops-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotelops-backend
    environment:
      - PORT=3001
      - NODE_ENV=production
      # YOU MUST PROVIDE YOUR OWN .env FILE OR SET THESE VARIABLES
      - DATABASE_URL=${DATABASE_URL}
      - APP_DATABASE_URL=${APP_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - ./backend/.env
    restart: always
    networks:
      - hotelops-network

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: hotelops-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.hotelops.com
    restart: always
    networks:
      - hotelops-network

networks:
  hotelops-network:
    driver: bridge
